[project]
name = "linkedin-post"
version = "0.2.0"
description = "mcp-server-linkedin plus create_post and delete_post tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitry Andersson" }]
requires-python = ">=3.12.4,<3.15"
dependencies = ["mcp-server-linkedin==4.29.0"]

[project.scripts]
linkedin-post-mcp = "linkedin_post.composition.upstream:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_post"]
